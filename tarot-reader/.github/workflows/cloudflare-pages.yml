name: Build and Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tarot-reader/package-lock.json

      - name: Install and Build
        working-directory: tarot-reader
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          projectname: heartofcards
          workingDir: tarot-reader
          # Optional: Set to 'true' to skip deployment for PR previews
          # set: true
        env:
          # Use secret token for authenticated deployment
          # CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Alternatively, use Cloudflare Pages CI/CD integration (recommended)
